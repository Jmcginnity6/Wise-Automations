<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Ledger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="House">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1614" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column — summary first, a two-way switch (bills / purchases), a list, a floating add button and a bottom sheet form. */
:root {
  --bg: #eef1ef;
  --surface: #ffffff;
  --ink: #17221f;
  --muted: #5e6c68;
  --line: #d9e0dd;
  --accent: #1d5c52;
  --accent-ink: #ffffff;
  --accent-soft: #d8e8e3;
  --danger: #b3261e;
  --danger-soft: #f8e1df;
  --hero: #17332e;
  --hero-ink: #f1f6f4;
  --hero-muted: #a9c2bb;
  --shadow: 0 10px 30px rgba(23, 50, 45, .16);
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Manrope", -apple-system, system-ui, sans-serif;
  --c1:#1d5c52; --c2:#c47a1b; --c3:#3d6fb4; --c4:#9a4f8c; --c5:#5d8c2f; --c6:#b5483b; --c7:#2f8b9c; --c8:#7a6a3a; --c9:#6a5bb8; --c10:#7d8784;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1614; --surface: #18221f; --ink: #e6eeeb; --muted: #94a59f; --line: #2a3733;
  --accent: #6cc3b0; --accent-ink: #0b1a17; --accent-soft: #1f3a34; --danger: #f2877d; --danger-soft: #3a1f1c;
  --hero: #1d3a34; --hero-ink: #eef6f3; --hero-muted: #9dbdb4; --shadow: 0 10px 30px rgba(0,0,0,.45);
  --c1:#6cc3b0; --c2:#e6a24a; --c3:#7fa8e6; --c4:#d08cc4; --c5:#9bc96a; --c6:#ec8a7c; --c7:#6cc7d6; --c8:#c9b57a; --c9:#a99cf0; --c10:#9aa5a1;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1614; --surface: #18221f; --ink: #e6eeeb; --muted: #94a59f; --line: #2a3733;
  --accent: #6cc3b0; --accent-ink: #0b1a17; --accent-soft: #1f3a34; --danger: #f2877d; --danger-soft: #3a1f1c;
  --hero: #1d3a34; --hero-ink: #eef6f3; --hero-muted: #9dbdb4; --shadow: 0 10px 30px rgba(0,0,0,.45);
  --c1:#6cc3b0; --c2:#e6a24a; --c3:#7fa8e6; --c4:#d08cc4; --c5:#9bc96a; --c6:#ec8a7c; --c7:#6cc7d6; --c8:#c9b57a; --c9:#a99cf0; --c10:#9aa5a1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 120px; display: flex; flex-direction: column; gap: 18px; }
.num { font-variant-numeric: tabular-nums; }
h1 { font-family: var(--font-display); font-size: 1.05rem; letter-spacing: .02em; margin: 0; color: var(--muted); font-weight: 600; }
.topline { display: flex; align-items: center; justify-content: space-between; }
.sync { font-size: .75rem; color: var(--muted); }

.hero { background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 16px; }
.hero .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--hero-muted); font-weight: 600; }
.hero .big { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; font-weight: 700; letter-spacing: -.02em; }
.hero .big small { font-size: 1rem; font-weight: 600; color: var(--hero-muted); letter-spacing: 0; margin-left: 4px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid rgba(255,255,255,.12); padding-top: 14px; }
.stat .v { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; margin-top: 3px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 600 .95rem var(--font-body); padding: 10px; border-radius: 10px; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible, .btn:focus-visible, .row:focus-visible, .fab:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.section { display: flex; flex-direction: column; gap: 10px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
.sechead h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; font-weight: 600; }
.sechead span { color: var(--muted); font-size: .85rem; }

.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); gap: 2px; }
.bar i { display: block; height: 100%; min-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); padding: 0 2px; }
.legend b { color: var(--ink); font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; flex: none; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:active { background: var(--accent-soft); }
.badge { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font: 700 .8rem var(--font-display); color: #fff; flex: none; }
.row .mid { flex: 1; min-width: 0; }
.row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: .8rem; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { text-align: right; font-weight: 700; }
.row .amt small { display: block; font-weight: 500; font-size: .75rem; color: var(--muted); }
.grouphead { padding: 10px 16px 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); background: var(--bg); }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; padding: 26px 20px; text-align: center; color: var(--muted); line-height: 1.5; }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 1.1rem; margin-bottom: 4px; }
.notice { font-size: .85rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }

.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); height: 56px; padding: 0 22px; border-radius: 28px; border: 0; background: var(--accent); color: var(--accent-ink); font: 700 1rem var(--font-body); box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; cursor: pointer; z-index: 5; }
.fab svg { width: 20px; height: 20px; }

.scrim { position: fixed; inset: 0; background: rgba(8, 18, 16, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(18px, env(safe-area-inset-left, 0px)); max-height: 92%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 2px; }
.sheet h3 { font-family: var(--font-display); font-size: 1.3rem; margin: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .flabel { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
input, select, textarea { font: 500 16px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; -webkit-appearance: none; appearance: none; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.money { position: relative; }
.money span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--muted); font-size: 1.2rem; }
.money input { padding-left: 32px; font-size: 1.4rem; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 8px 13px; font: 600 .85rem var(--font-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 0; border-radius: 14px; padding: 14px; font: 700 1rem var(--font-body); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn:disabled { opacity: .5; }
.err { color: var(--danger); font-size: .85rem; min-height: 1em; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .9rem; z-index: 30; }
.backup { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.backup p { margin: 0; color: var(--muted); font-size: .82rem; line-height: 1.5; }
.backup .two .btn { font-size: .9rem; padding: 12px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topline">
    <h1>House Ledger</h1>
    <span class="sync" id="sync">Loading…</span>
  </div>

  <section class="hero" aria-label="Summary">
    <div>
      <div class="label">Going out every month</div>
      <div class="big num" id="monthly">£0<small>/mo</small></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="label">Bills per year</div><div class="v num" id="yearly">£0</div></div>
      <div class="stat"><div class="label">Spent doing it up</div><div class="v num" id="spent">£0</div></div>
    </div>
  </section>

  <div class="seg" role="tablist">
    <button role="tab" id="tab-bills" aria-selected="true">Bills</button>
    <button role="tab" id="tab-buys" aria-selected="false">Purchases</button>
  </div>

  <div id="notice" class="notice" hidden></div>
  <div id="view" class="section"></div>

  <section class="backup" aria-label="Backup">
    <div class="sechead"><h2>Backup</h2></div>
    <p>Everything is saved on this phone only. Save a backup now and then (to Files or iCloud Drive) so you can restore it on a new phone.</p>
    <div class="two">
      <button type="button" class="btn ghost" id="export">Save backup</button>
      <button type="button" class="btn ghost" id="import">Restore backup</button>
    </div>
    <input type="file" id="importfile" accept="application/json,.json" hidden>
  </section>
</div>

<button class="fab" id="add" aria-label="Add">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Add
</button>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="form" novalidate>
    <div class="grab"></div>
    <h3 id="ftitle">Add</h3>
    <div class="field">
      <span class="flabel">What is it?</span>
      <div class="chips" id="kinds">
        <button type="button" class="chip" data-kind="monthly">Monthly bill</button>
        <button type="button" class="chip" data-kind="yearly">Yearly bill</button>
        <button type="button" class="chip" data-kind="oneoff">One-off purchase</button>
      </div>
    </div>
    <div class="field">
      <label for="f-amount">Amount</label>
      <div class="money"><span>£</span><input id="f-amount" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
    </div>
    <div class="field">
      <label for="f-name">Name</label>
      <input id="f-name" placeholder="e.g. Home insurance" autocomplete="off" maxlength="60">
    </div>
    <div class="field">
      <span class="flabel">Category</span>
      <div class="chips" id="cats"></div>
    </div>
    <div class="two">
      <div class="field">
        <label for="f-date" id="f-date-l">Date</label>
        <input id="f-date" type="date">
      </div>
      <div class="field">
        <label for="f-note">Note</label>
        <input id="f-note" placeholder="Optional" maxlength="80" autocomplete="off">
      </div>
    </div>
    <div class="err" id="ferr"></div>
    <button type="submit" class="btn primary" id="save">Save</button>
    <div class="two">
      <button type="button" class="btn ghost" id="cancel">Cancel</button>
      <button type="button" class="btn danger" id="del" hidden>Delete</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script>
const BILL_CATS = ["Mortgage","Rates","Electricity","Gas","Heating oil","Home insurance","Life insurance","Broadband","Phone","TV & subscriptions","Other bill"];
const BUY_CATS = ["Furniture","Decorating","Appliances","Flooring","Kitchen","Bathroom","Garden","DIY & tools","Soft furnishings","Other"];
const COLORS = ["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8","--c9","--c10","--c10"];
const colorFor = (cat) => {
  let i = BILL_CATS.indexOf(cat); if (i < 0) i = BUY_CATS.indexOf(cat); if (i < 0) i = 10;
  return `var(${COLORS[i]})`;
};
const initials = (s) => s.replace(/&/g," ").split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join("");
const fmt = (p, dp) => {
  const v = p / 100;
  const d = dp ?? (Number.isInteger(v) ? 0 : 2);
  return "£" + v.toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
};
const monthlyOf = (it) => it.kind === "monthly" ? it.pence : it.kind === "yearly" ? Math.round(it.pence / 12) : 0;
const today = () => new Date().toISOString().slice(0, 10);
const niceDate = (d) => { try { return new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); } catch { return d; } };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

let items = [];
let tab = "bills";
let col = null;
let editing = null;
let form = { kind: "monthly", cat: "Mortgage" };
let confirmDel = false;

try { const t = localStorage.getItem("hl-tab"); if (t === "buys") tab = "buys"; } catch {}

function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 1800); }

function render() {
  const bills = items.filter(i => i.kind !== "oneoff");
  const buys = items.filter(i => i.kind === "oneoff");
  const monthly = bills.reduce((s, i) => s + monthlyOf(i), 0);
  const yearly = bills.reduce((s, i) => s + (i.kind === "monthly" ? i.pence * 12 : i.pence), 0);
  const spent = buys.reduce((s, i) => s + i.pence, 0);
  $("monthly").innerHTML = `${fmt(monthly)}<small>/mo</small>`;
  $("yearly").textContent = fmt(yearly, 0);
  $("spent").textContent = fmt(spent);

  $("tab-bills").setAttribute("aria-selected", tab === "bills");
  $("tab-buys").setAttribute("aria-selected", tab === "buys");

  const view = $("view");
  if (tab === "bills") {
    if (!bills.length) { view.innerHTML = `<div class="empty"><strong>No bills yet</strong>Add your mortgage, rates, electric, gas and insurance with the Add button. You'll see your monthly total at the top.</div>`; return; }
    const byCat = groupBy(bills, monthlyOf);
    const sorted = [...bills].sort((a, b) => monthlyOf(b) - monthlyOf(a));
    view.innerHTML = `
      <div class="sechead"><h2>Where it goes</h2><span class="num">${bills.length} bill${bills.length === 1 ? "" : "s"}</span></div>
      ${barHTML(byCat, monthly)}
      <div class="list">${sorted.map(rowBill).join("")}</div>`;
  } else {
    if (!buys.length) { view.innerHTML = `<div class="empty"><strong>Nothing bought yet</strong>Add furniture, paint, appliances and anything else for doing the house up. Each one adds to your running total.</div>`; return; }
    const byCat = groupBy(buys, i => i.pence);
    const sorted = [...buys].sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
    const months = [];
    for (const it of sorted) {
      const key = (it.date || "").slice(0, 7);
      let g = months.find(m => m.key === key);
      if (!g) { g = { key, items: [], total: 0 }; months.push(g); }
      g.items.push(it); g.total += it.pence;
    }
    view.innerHTML = `
      <div class="sechead"><h2>By category</h2><span class="num">${buys.length} item${buys.length === 1 ? "" : "s"}</span></div>
      ${barHTML(byCat, spent)}
      <div class="list">${months.map(m => `
        <div class="grouphead"><span>${m.key ? new Date(m.key + "-15").toLocaleDateString("en-GB", { month: "long", year: "numeric" }) : "No date"}</span><span class="num">${fmt(m.total)}</span></div>
        ${m.items.map(rowBuy).join("")}`).join("")}
      </div>`;
  }
}

function groupBy(list, val) {
  const m = new Map();
  for (const i of list) m.set(i.category, (m.get(i.category) || 0) + val(i));
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function barHTML(entries, total) {
  if (!total) return "";
  return `<div class="bar" role="img" aria-label="Split by category">${entries.map(([c, v]) => `<i style="flex:${v};background:${colorFor(c)}"></i>`).join("")}</div>
    <div class="legend">${entries.map(([c, v]) => `<span><span class="dot" style="background:${colorFor(c)}"></span>${esc(c)} <b class="num">${Math.round(v / total * 100)}%</b></span>`).join("")}</div>`;
}
function rowBill(it) {
  const sub = it.kind === "yearly" ? `<small>${fmt(it.pence)}/yr</small>` : "";
  const main = it.kind === "yearly" ? `${fmt(monthlyOf(it), 2)}/mo` : `${fmt(it.pence)}/mo`;
  const meta = [it.category, it.kind === "yearly" ? "Yearly" : "Monthly", it.note].filter(Boolean).map(esc).join(" · ");
  return `<button class="row" data-id="${esc(it.id)}"><span class="badge" style="background:${colorFor(it.category)}">${esc(initials(it.category))}</span>
    <span class="mid"><div class="name">${esc(it.name)}</div><div class="meta">${meta}</div></span>
    <span class="amt num">${main}${sub}</span></button>`;
}
function rowBuy(it) {
  const meta = [it.category, it.date ? niceDate(it.date) : "", it.note].filter(Boolean).map(esc).join(" · ");
  return `<button class="row" data-id="${esc(it.id)}"><span class="badge" style="background:${colorFor(it.category)}">${esc(initials(it.category))}</span>
    <span class="mid"><div class="name">${esc(it.name)}</div><div class="meta">${meta}</div></span>
    <span class="amt num">${fmt(it.pence)}</span></button>`;
}

/* ---------- form ---------- */
function paintForm() {
  document.querySelectorAll("#kinds .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.kind === form.kind));
  const cats = form.kind === "oneoff" ? BUY_CATS : BILL_CATS;
  if (!cats.includes(form.cat)) form.cat = cats[0];
  $("cats").innerHTML = cats.map(c => `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${c === form.cat}">${esc(c)}</button>`).join("");
  $("f-date-l").textContent = form.kind === "oneoff" ? "Date bought" : "Started";
  $("f-name").placeholder = form.kind === "oneoff" ? "e.g. Kitchen table" : "e.g. Home insurance";
}
function openForm(it) {
  editing = it || null; confirmDel = false;
  form = it ? { kind: it.kind, cat: it.category } : { kind: tab === "buys" ? "oneoff" : "monthly", cat: tab === "buys" ? BUY_CATS[0] : BILL_CATS[0] };
  $("ftitle").textContent = it ? "Edit" : "Add";
  $("f-amount").value = it ? (it.pence / 100).toFixed(2) : "";
  $("f-name").value = it ? it.name : "";
  $("f-date").value = it ? (it.date || "") : (form.kind === "oneoff" ? today() : "");
  $("f-note").value = it ? (it.note || "") : "";
  $("del").hidden = !it; $("del").textContent = "Delete";
  $("ferr").textContent = "";
  paintForm();
  $("scrim").hidden = false;
  if (!it) setTimeout(() => $("f-amount").focus(), 50);
}
function closeForm() { $("scrim").hidden = true; editing = null; }

$("kinds").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; form.kind = b.dataset.kind; if (form.kind === "oneoff" && !$("f-date").value) $("f-date").value = today(); paintForm(); });
$("cats").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; form.cat = b.dataset.cat; paintForm(); });
$("cancel").addEventListener("click", closeForm);
$("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeForm(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("scrim").hidden) closeForm(); });
$("add").addEventListener("click", () => openForm());
$("view").addEventListener("click", e => { const r = e.target.closest(".row"); if (!r) return; const it = items.find(i => i.id === r.dataset.id); if (it) openForm(it); });
function setTab(t) { tab = t; try { localStorage.setItem("hl-tab", t); } catch {} render(); }
$("tab-bills").addEventListener("click", () => setTab("bills"));
$("tab-buys").addEventListener("click", () => setTab("buys"));

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const raw = $("f-amount").value.replace(/[£,\s]/g, "");
  const val = Number(raw);
  if (!raw || !isFinite(val) || val <= 0) { $("ferr").textContent = "Enter an amount, like 30 or 24.99."; return; }
  const name = $("f-name").value.trim() || form.cat;
  const doc = { name, pence: Math.round(val * 100), kind: form.kind, category: form.cat, date: $("f-date").value || "", note: $("f-note").value.trim(), createdAt: editing?.createdAt || Date.now() };
  if (!col) { $("ferr").textContent = "Can't save right now. Try again."; return; }
  $("save").disabled = true;
  try {
    if (editing) await col.doc(editing.id).set(doc); else await col.add(doc);
    toast(editing ? "Updated" : "Added");
    if (!editing) setTab(form.kind === "oneoff" ? "buys" : "bills");
    closeForm();
  } catch (err) {
    $("ferr").textContent = err?.code === "quota_exceeded" ? "Storage is full. Delete a few old entries and try again." : "Couldn't save. Check your connection and try again.";
  } finally { $("save").disabled = false; }
});
$("del").addEventListener("click", async () => {
  if (!editing) return;
  if (!confirmDel) { confirmDel = true; $("del").textContent = "Tap again to delete"; return; }
  try { await col.doc(editing.id).delete(); toast("Deleted"); closeForm(); }
  catch { $("ferr").textContent = "Couldn't delete. Try again."; }
});

/* ---------- data: stored on this device ---------- */
const KEY = "house-ledger-items-v1";
function load() { try { const v = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(v) ? v.filter(i => i && typeof i.pence === "number") : []; } catch { return []; } }
function persist() { localStorage.setItem(KEY, JSON.stringify(items)); }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
col = {
  add: async (d) => { items.push({ id: newId(), ...d }); persist(); render(); },
  doc: (id) => ({
    set: async (d) => { items = items.map(i => i.id === id ? { id, ...d } : i); persist(); render(); },
    delete: async () => { items = items.filter(i => i.id !== id); persist(); render(); },
  }),
};
items = load();
render();
$("sync").textContent = "Saved on this phone";
try { navigator.storage?.persist?.(); } catch {}

$("export").addEventListener("click", async () => {
  const json = JSON.stringify({ app: "house-ledger", version: 1, exported: new Date().toISOString(), items }, null, 2);
  const name = `house-ledger-${today()}.json`;
  const file = new File([json], name, { type: "application/json" });
  try {
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: "House Ledger backup" }); return; }
  } catch (e) { if (e?.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});
let importArmed = false;
$("import").addEventListener("click", () => {
  if (items.length && !importArmed) { importArmed = true; $("import").textContent = "Tap again: replaces all"; setTimeout(() => { importArmed = false; $("import").textContent = "Restore backup"; }, 4000); return; }
  importArmed = false; $("import").textContent = "Restore backup";
  $("importfile").click();
});
$("importfile").addEventListener("change", async (e) => {
  const f = e.target.files?.[0]; e.target.value = "";
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data) ? data : data.items;
    if (!Array.isArray(list)) throw 0;
    items = list.filter(i => i && typeof i.pence === "number" && i.kind).map(i => ({ ...i, id: i.id || newId() }));
    persist(); render(); toast(`Restored ${items.length} entries`);
  } catch { toast("That file isn't a House Ledger backup"); }
});

if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>
